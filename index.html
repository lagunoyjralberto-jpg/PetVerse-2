<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PetVerse 2</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:linear-gradient(180deg,#071b2f,#103d5f,#0b7d5b);
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
color:white;
}

#menu{
text-align:center;
}

h1{
font-size:60px;
margin-bottom:10px;
text-shadow:0 0 20px cyan;
}

p{
font-size:22px;
margin-bottom:40px;
color:#d8f8ff;
}

button{
width:280px;
padding:18px;
margin:12px;
font-size:22px;
border:none;
border-radius:15px;
cursor:pointer;
background:#00c853;
color:white;
transition:.3s;
}

button:hover{
transform:scale(1.05);
background:#00e676;
}

.footer{
position:absolute;
bottom:15px;
width:100%;
text-align:center;
font-size:16px;
color:white;
}
</style>
<link rel="stylesheet" href="style.css">
</head>

<div id="menu">

<h1>🐾 PETVERSE 2</h1>

<p>Explore • Hatch • Breed • Battle</p>

<button onclick="comingSoon()">🥚 Egg Hatch</button><br>

<button onclick="comingSoon()">🐾 Pet Collection</button><br>

<button onclick="comingSoon()">❤️ Pet Breeding</button><br>

<button onclick="comingSoon()">🛒 Marketplace</button><br>

<button onclick="comingSoon()">⚙️ Settings</button>

</div>

<div class="footer">

</div>

}

}
